<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vendor Portal - Milk Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            background: #2c3e50;
            color: white;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        .container {
            flex: 1;
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .vendor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .vendor-card {
            background: #f8f9fa;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e9ecef;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }

        .vendor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #3498db;
        }

        .vendor-card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid #3498db;
        }

        .vendor-card h3 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .vendor-card .view-text {
            color: #3498db;
            font-size: 14px;
            font-weight: bold;
        }

        .empty-msg {
            color: #888;
            font-style: italic;
            text-align: center;
            padding: 40px;
        }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f5c6cb;
        }

        .back-link {
            display: block;
            text-align: center;
            padding: 20px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Vendor Portal</h1>

    <div class="container">
        {% if error %}
        <div class="error-msg">
            {{ error }}
        </div>
        {% endif %}

        <div class="section">
            <h2>All Vendors</h2>
            {% if vendors %}
            <div class="vendor-grid">
                {% for v in vendors %}
                <a href="/vendor/detail?vid={{ v.id }}" class="vendor-card">
                    <img src="{{ v.image_url }}" alt="{{ v.name }}">
                    <h3>{{ v.name }}</h3>
                    <span class="view-text">View Details →</span>
                </a>
                {% endfor %}
            </div>
            {% else %}
            <p class="empty-msg">No vendors available.</p>
            {% endif %}
        </div>
    </div>

    <a href="/" class="back-link">← Back to Home</a>
</body>
</html>
