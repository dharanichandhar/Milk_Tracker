<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milk Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            background: #2c3e50;
            color: white;
            padding: 20px;
            margin: 0;
            text-align: center;
            font-size: 28px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            color: white;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
            max-width: 500px;
            margin: 0 auto;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .portals {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }

        .portal-card {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 250px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .portal-icon {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .portal-card h3 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .portal-card p {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 8px 50px;
            font-size: 18px;
            text-decoration: none;
            background: #3498db;
            color: white;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #2980b9;
        }

        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Milk Tracker</h1>

    <div class="hero">
        <h2>Welcome to Milk Tracker</h2>
        <p>Manage your milk subscriptions easily. Track vendors, subscribe to services, and more.</p>
    </div>

    <div class="container">
        <div class="portals">
            <div class="portal-card">
                <div class="portal-icon">⚙️</div>
                <h3>Admin</h3>
                <p>Manage vendors</p>
                <a href="/admin" class="btn">Enter</a>
            </div>

            <div class="portal-card">
                <div class="portal-icon">👤</div>
                <h3>Customer</h3>
                <p>Subscribe to milk vendors </p>
                <a href="/customer" class="btn">Enter</a>
            </div>

            <div class="portal-card">
                <div class="portal-icon">🚚</div>
                <h3>Vendor</h3>
                <p>View customer subscriptions </p>
                <a href="/vendor" class="btn">Enter</a>
            </div>
        </div>
    </div>

</body>
</html>
