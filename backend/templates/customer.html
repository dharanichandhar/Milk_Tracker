<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer - Milk Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            background: #2c3e50;
            color: white;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-card {
            background: white;
            padding: 50px 60px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        .form-card h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 35px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 18px;
        }

        .btn-submit:hover {
            background: #2980b9;
        }

        .toggle-link {
            display: block;
            text-align: center;
            color: #3498db;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            padding: 10px;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            padding: 20px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 22px;
            text-align: center;
            border: 1px solid #f5c6cb;
            font-size: 15px;
        }

        /* Hidden Checkbox for Toggle */
        .toggle-input {
            display: none;
        }

        /* Form Visibility States */
        .login-form {
            display: block;
        }

        .signup-form {
            display: none;
        }

        .link-login {
            display: block;
        }

        .link-signup {
            display: none;
        }

        /* Toggle Logic - CSS Checkbox Hack */
        /* When checkbox checked: Show Signup, Hide Login */
        #toggle-form:checked ~ .login-form {
            display: none;
        }

        #toggle-form:checked ~ .signup-form {
            display: block;
        }

        #toggle-form:checked ~ .link-login {
            display: none;
        }

        #toggle-form:checked ~ .link-signup {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Customer Portal</h1>

    <div class="container">
        <div class="form-card">
            <h2>Milk Tracker</h2>

            <!-- Error Messages -->
            {% if request.query_params.get('error') == 'login' %}
            <div class="error-msg">
                Invalid email or password. Please try again.
            </div>
            {% endif %}

            {% if request.query_params.get('error') == 'signup' %}
            <div class="error-msg">
                Email already exists. Please try again.
            </div>
            {% endif %}

            <!-- Hidden Checkbox for Toggle -->
            <input type="checkbox" id="toggle-form" class="toggle-input">

            <!-- Login Form -->
            <form class="login-form" action="/api/customers/login" method="POST">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit">Login</button>
            </form>

            <!-- Signup Form -->
            <form class="signup-form" action="/api/customers/create" method="POST">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit">Signup</button>
            </form>

            <!-- Toggle Links -->
            <label for="toggle-form" class="toggle-link link-login">
                New user? Signup here
            </label>

            <label for="toggle-form" class="toggle-link link-signup">
                Already have account? Login here
            </label>
        </div>
    </div>

    <a href="/" class="back-link">← Back to Home</a>
</body>
</html>
