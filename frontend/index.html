<!DOCTYPE html>
<html lang="en">
<head>
    <title>Milk Tracker</title>
</head>
<body>

    <h1>Milk Delivery Tracking App</h1>



    <button>Admin</button>
    <button>Vendor</button>
    <button>Customer</button>

    
    <h2>Vendor</h2>
    <form action="/api/vendors/particular_vendor" method="GET">
        <input type="text" name="vendor_id" placeholder="Enter Vendor ID">
        <button type="submit">Fetch Vendor</button>
    </form>

  
    <h2>Customer</h2>
    <form action="/api/customers/particular" method="GET">
        <input type="text" name="customer_id" placeholder="Enter Customer ID">
        <button type="submit">Fetch Customer</button>
    </form>

    
    <h2>Add Vendor</h2>
    <form action="/api/vendors/create" method="POST">
        <input type="text" name="name" placeholder="Enter Vendor Name">
        <button type="submit">Add Vendor</button>
    </form>

    
    <h2>Add Customer</h2>
    <form action="/api/customers/create" method="POST">
        <input type="text" name="name" placeholder="Enter Customer Name">
        <button type="submit">Add Customer</button>
    </form>

    
    <h2>All Vendors</h2>
    <form action="/api/vendors" method="GET">
        <button type="submit">Get All Vendors</button>
    </form>

    
    <h2>All Customers</h2>
    <form action="/api/customers" method="GET">
        <button type="submit">Get All Customers</button>
    </form>

</body>
</html>
